<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeikkiBurger - Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-one"></div>
    <div class="bg-shape bg-shape-two"></div>

    <header class="topbar">
      <div>
        <p class="kicker">Leikkikeittio</p>
        <h1>LeikkiBurger Menu</h1>
      </div>
      <div class="top-actions">
        <div class="total-pill">Kori: <span id="header-count">0 kpl</span> - <span id="header-total">0,00 €</span></div>
        <a class="primary-link" href="cart.html">Avaa kori</a>
      </div>
    </header>

    <main class="layout single-col">
      <section class="panel menu-panel">
        <h2>Valitse tuote</h2>
        <p class="panel-subtitle">Paina plusmerkista ja muokkaa tilaus menun paalla.</p>
        <div id="menu-grid" class="menu-grid"></div>
        <p id="menu-status" class="status-message"></p>
      </section>
    </main>

    <dialog id="customize-dialog" class="customize-dialog large-dialog">
      <form id="customize-form">
        <h3 id="dialog-item-name">Muokkaa tuotetta</h3>
        <div class="dialog-hero">
          <img id="dialog-item-image" class="item-image" src="" alt="" />
          <div>
            <p id="dialog-item-description" class="menu-description"></p>
            <p id="dialog-item-price" class="dialog-price"></p>
          </div>
        </div>

        <fieldset class="options-group">
          <legend>Taytteet</legend>
          <label><input type="checkbox" name="juusto" /> Juusto</label>
          <label><input type="checkbox" name="sipuli" /> Sipuli</label>
          <label><input type="checkbox" name="kastike" /> Kastike</label>
          <label><input type="checkbox" name="tomaatti" /> Tomaatti</label>
          <label><input type="checkbox" name="salaatti" /> Salaatti</label>
        </fieldset>

        <label class="quantity-label" for="qty">Maara</label>
        <input id="qty" name="qty" type="number" min="1" max="20" value="1" required />

        <h3>Kaikki tuotteet kuvina</h3>
        <div id="modal-product-gallery" class="product-gallery"></div>

        <menu>
          <button type="button" id="dialog-cancel" class="ghost-btn">Peruuta</button>
          <button type="submit" class="primary-btn">Lisaa koriin</button>
        </menu>
      </form>
    </dialog>

    <dialog id="sides-dialog" class="customize-dialog">
      <form id="sides-form">
        <h3>Lisukkeet</h3>
        <p class="panel-subtitle">Tilaa lisukkeet erikseen. Anna maara tuotteille joita haluat.</p>

        <div class="sides-grid" id="sides-grid"></div>

        <menu>
          <button type="button" id="sides-cancel" class="ghost-btn">Peruuta</button>
          <button type="submit" class="primary-btn">Lisaa lisukkeet koriin</button>
        </menu>
      </form>
    </dialog>

    <script src="shared.js"></script>
    <script src="menu.js"></script>
  </body>
</html>
